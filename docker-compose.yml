services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cheaptravel
      POSTGRES_PASSWORD: cheaptravel
      POSTGRES_DB: cheaptravel
    ports:
      - "5432:5432"
    volumes:
      - cheap-travel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheaptravel -d cheaptravel"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cheap-travel-postgres:
